<div class="mx-auto max-w-7xl px-4 py-8">
  @if (brand() === undefined) {
    <div class="mb-8 h-28 animate-pulse rounded-2xl bg-cloud"></div>
  } @else if (brand(); as b) {
    <header class="mb-8 flex items-center gap-5 rounded-2xl bg-mist p-5">
      <span class="grid h-20 w-28 shrink-0 place-items-center rounded-xl bg-white p-2">
        <img [src]="b.image" [alt]="b.name" width="112" height="80" class="max-h-full w-auto object-contain" />
      </span>
      <h1 class="text-2xl font-extrabold text-ink sm:text-3xl">{{ b.name }}</h1>
    </header>

    @if (result() === undefined) {
      <div class="grid grid-cols-2 gap-4 md:grid-cols-3 xl:grid-cols-4"><app-skeleton [count]="8" /></div>
    } @else if (result(); as res) {
      @if (res.data.length) {
        <div class="grid grid-cols-2 gap-4 md:grid-cols-3 xl:grid-cols-4">
          @for (p of res.data; track p._id) {
            <app-product-card [product]="p" />
          }
        </div>
        <app-pagination [current]="res.metadata.currentPage" [total]="res.metadata.numberOfPages" (pageChange)="goPage($event)" />
      } @else {
        <app-empty-state icon="fa-solid fa-box-open" [title]="'brands.noProducts' | translate" />
      }
    } @else {
      <app-empty-state icon="fa-solid fa-box-open" [title]="'brands.noProducts' | translate" />
    }
  } @else {
    <app-empty-state
      icon="fa-solid fa-tag"
      [title]="'brands.notFound' | translate"
      [actionLabel]="'nav.brands' | translate"
      actionLink="/brands"
    />
  }
</div>
