<h1 class="text-3xl font-extrabold text-ink">{{ 'auth.welcomeBack' | translate }}</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-5" novalidate>
  <div>
    <label for="email" class="mb-1 block text-sm font-semibold text-ink">{{ 'auth.email' | translate }}</label>
    <input id="email" type="email" formControlName="email" class="input" autocomplete="email" />
    @if (show(form.controls.email)) {
      <p class="err">{{ 'auth.err.email' | translate }}</p>
    }
  </div>

  <div>
    <div class="mb-1 flex items-center justify-between">
      <label for="password" class="text-sm font-semibold text-ink">{{ 'auth.password' | translate }}</label>
      <a routerLink="/forgot-password" class="text-xs font-semibold text-primary hover:underline">
        {{ 'auth.forgot' | translate }}
      </a>
    </div>
    <div class="relative">
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        class="input pe-10"
        autocomplete="current-password"
      />
      <button
        type="button"
        class="absolute end-3 top-1/2 -translate-y-1/2 text-navy/50"
        [attr.aria-label]="'auth.password' | translate"
        (click)="showPassword.set(!showPassword())"
      >
        <i [class]="showPassword() ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
      </button>
    </div>
    @if (show(form.controls.password)) {
      <p class="err">{{ 'auth.err.passwordRequired' | translate }}</p>
    }
  </div>

  <button type="submit" class="btn w-full" [disabled]="loading()">
    {{ (loading() ? 'auth.signingIn' : 'auth.signIn') | translate }}
  </button>
</form>

<p class="mt-6 text-center text-sm text-navy/70">
  {{ 'auth.noAccount' | translate }}
  <a routerLink="/register" class="font-bold text-primary hover:underline">{{ 'auth.signUp' | translate }}</a>
</p>
