<div class="mx-auto max-w-7xl px-4 py-8">
  <h1 class="mb-6 text-2xl font-extrabold text-ink">{{ 'wishlist.title' | translate }}</h1>

  @if (wishlist.loading() && !wishlist.items().length) {
    <div class="grid grid-cols-2 gap-4 md:grid-cols-3 xl:grid-cols-4"><app-skeleton [count]="4" /></div>
  } @else if (wishlist.items().length) {
    <div class="grid grid-cols-2 gap-4 md:grid-cols-3 xl:grid-cols-4">
      @for (p of wishlist.items(); track p._id) {
        <app-product-card [product]="p" />
      }
    </div>
  } @else {
    <app-empty-state
      icon="fa-regular fa-heart"
      [title]="'wishlist.emptyTitle' | translate"
      [text]="'wishlist.emptyText' | translate"
      [actionLabel]="'common.browseProducts' | translate"
      actionLink="/products"
    />
  }
</div>
