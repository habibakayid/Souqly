@if (slides().length) {
  <div id="hero-carousel" class="relative w-full" data-carousel="slide">
    <div class="relative h-72 overflow-hidden rounded-2xl sm:h-96">
      @for (p of slides(); track p._id; let i = $index) {
        <div class="hidden duration-700 ease-in-out" [attr.data-carousel-item]="i === 0 ? 'active' : ''">
          <div class="flex h-full items-center bg-linear-to-br from-navy to-primary px-6 sm:px-14">
            <div class="max-w-md flex-1 text-white">
              <p class="mb-2 text-xs font-semibold text-sky">{{ p.category?.name }}</p>
              <h2 class="line-clamp-2 text-2xl font-extrabold leading-tight sm:text-4xl">{{ p.title }}</h2>
              <p class="mt-3 text-lg font-bold">{{ p.priceAfterDiscount ?? p.price | egp }}</p>
              <a
                [routerLink]="['/products', p._id]"
                class="mt-5 inline-flex rounded-xl bg-white px-5 py-2.5 text-sm font-bold text-navy transition hover:bg-mist"
              >
                {{ 'home.shopNow' | translate }}
              </a>
            </div>
            <div class="hidden h-full flex-1 items-center justify-center py-6 sm:flex">
              <img
                [ngSrc]="p.imageCover"
                width="400"
                height="400"
                [alt]="p.title"
                [priority]="i === 0"
                class="max-h-full w-auto rounded-2xl object-contain"
              />
            </div>
          </div>
        </div>
      }
    </div>

    <div class="absolute bottom-4 start-1/2 z-30 flex -translate-x-1/2 gap-2 rtl:translate-x-1/2">
      @for (p of slides(); track p._id; let i = $index) {
        <button
          type="button"
          class="h-2.5 w-2.5 rounded-full bg-white/50"
          [attr.aria-current]="i === 0"
          [attr.aria-label]="'Slide ' + (i + 1)"
          [attr.data-carousel-slide-to]="i"
        ></button>
      }
    </div>

    <button type="button" class="group absolute start-0 top-0 z-30 flex h-full items-center px-3" data-carousel-prev aria-label="Previous">
      <span class="grid h-9 w-9 place-items-center rounded-full bg-white/30 group-hover:bg-white/50">
        <i class="fa-solid fa-chevron-left text-white rtl:rotate-180"></i>
      </span>
    </button>
    <button type="button" class="group absolute end-0 top-0 z-30 flex h-full items-center px-3" data-carousel-next aria-label="Next">
      <span class="grid h-9 w-9 place-items-center rounded-full bg-white/30 group-hover:bg-white/50">
        <i class="fa-solid fa-chevron-right text-white rtl:rotate-180"></i>
      </span>
    </button>
  </div>
}
