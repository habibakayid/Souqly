<div class="card flex items-center gap-4 p-4">
  <span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-mist text-lg text-primary">
    <i [class]="icon()"></i>
  </span>
  <div class="min-w-0">
    <p class="truncate text-xs font-semibold text-navy/60">{{ label() }}</p>
    <p class="truncate text-xl font-extrabold text-ink">{{ value() }}</p>
    @if (hint()) {
      <p class="truncate text-xs text-navy/60">{{ hint() }}</p>
    }
  </div>
</div>
