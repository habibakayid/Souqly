<footer class="mt-20 bg-linear-to-br from-navy via-navy to-primary text-white">
  <div class="h-1 w-full bg-linear-to-r from-sky via-brand to-primary"></div>

  <div class="mx-auto grid max-w-7xl gap-10 px-4 py-14 sm:grid-cols-2 lg:grid-cols-4">
    <div class="space-y-5 sm:col-span-2">
      <a routerLink="/home" class="inline-flex rounded-xl bg-white px-4 py-2.5 shadow-lg">
        <img src="/assets/images/logo.png" alt="Souqly" class="h-9 w-auto" />
      </a>
      <p class="max-w-sm text-sm leading-relaxed text-white/80">{{ 'footer.tagline' | translate }}</p>
    </div>

    <nav [attr.aria-label]="'footer.shop' | translate">
      <h3 class="mb-4 text-sm font-bold uppercase tracking-wide text-sky">{{ 'footer.shop' | translate }}</h3>
      <ul class="space-y-3">
        @for (l of shop; track l.path) {
          <li>
            <a [routerLink]="l.path" class="text-sm text-white/80 underline-offset-4 transition hover:text-white hover:underline">
              {{ l.key | translate }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <nav [attr.aria-label]="'footer.account' | translate">
      <h3 class="mb-4 text-sm font-bold uppercase tracking-wide text-sky">{{ 'footer.account' | translate }}</h3>
      <ul class="space-y-3">
        @for (l of account; track l.path) {
          <li>
            <a [routerLink]="l.path" class="text-sm text-white/80 underline-offset-4 transition hover:text-white hover:underline">
              {{ l.key | translate }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>

  <div class="border-t border-white/15 bg-ink/30">
    <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-3 px-4 py-5 sm:flex-row">
      <p class="text-xs text-white/70">{{ 'footer.rights' | translate: { year } }}</p>
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-lg border border-white/30 px-3 py-1.5 text-xs font-semibold transition hover:bg-white/10"
          (click)="lang.toggle()"
        >
          <i class="fa-solid fa-globe"></i> {{ 'nav.otherLang' | translate }}
        </button>
        <button
          type="button"
          class="grid h-9 w-9 place-items-center rounded-full bg-sky text-ink transition hover:bg-white"
          [attr.aria-label]="'footer.top' | translate"
          (click)="toTop()"
        >
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>
</footer>
