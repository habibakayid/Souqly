@for (i of items(); track i) {
  @if (shape() === 'card') {
    <div class="card animate-pulse overflow-hidden" aria-hidden="true">
      <div class="aspect-square bg-cloud"></div>
      <div class="space-y-2 p-3">
        <div class="h-3 w-1/3 rounded bg-cloud"></div>
        <div class="h-4 w-4/5 rounded bg-cloud"></div>
        <div class="h-4 w-1/2 rounded bg-cloud"></div>
      </div>
    </div>
  } @else {
    <div class="h-5 animate-pulse rounded bg-cloud" aria-hidden="true"></div>
  }
}
