<div class="grid min-h-screen lg:grid-cols-2">
  
  <div class="relative hidden bg-navy lg:block">
    <img src="/assets/images/auth.png" alt="" class="absolute inset-0 h-full w-full object-cover opacity-90" />
    <a routerLink="/home" class="absolute start-8 top-8">
      <img src="/assets/images/logo.png" alt="Souqly" class="h-10 w-auto" />
    </a>
  </div>

 
  <div class="flex flex-col bg-white px-6 py-8 sm:px-12">
    <div class="flex items-center justify-between">
      <a routerLink="/home" class="lg:invisible">
        <img src="/assets/images/logo.png" alt="Souqly" class="h-9 w-auto" />
      </a>
      <button type="button" class="text-sm font-semibold text-primary hover:underline" (click)="lang.toggle()">
        {{ 'nav.otherLang' | translate }}
      </button>
    </div>
    <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-10">
      <router-outlet />
    </div>
  </div>
</div>
